<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <style>
        body
        {
            margin: 0;
            overflow: hidden;
        }
    </style>

    <body>
        <img src="images/natural.jpg" id="back">
        <!--
            ASCII
            A = 65
            a = 97
            enter = 13
        -->
    
    <script>

      var bird =  document.createElement("img")
      document.body.appendChild(bird)
      var back =  document.getElementById("back")
      bird.style="position:absolute;left:0px;top:-3000px;"

      bird.src="images/b9.gif"
      bird.style="position:absolute;width:200px;left:0px;top:0px;"
      var k
      var 1 = 0
      var t = 0
      var b9 = 0
      function f1(e)
      {

        k =e.key
        switch(k)
        {

               case "ArrowRight" :
                if(1<window.innerWidth-200)
               {
                1+=10
                b9-=10
               }
               bird.style.left = 1+"px"
               bird.style.transform ="rotateY(0deg)"
               back.style.left=b9+"px"
               break;
               case "ArrowLeft"  :
                b1+=10
        }
               bird.style.left = 1+"px"
               bird.style.transform ="rotateY(0deg)"
               back.style.left=b9+"px"
               break;
               
               case "ArrowDown" :
                if(t<window.innerHeight-150)
                {
                    t=t+5
                }

                bird.style.top = t+"px"
                break;

                case "ArrowUp" :
                if(t>0)
               {
                t=t-5
               }
               bird.style.top = t+"px"
               break;
        }
        document.title = e.key
      }


      document.addEventListener("keydown",f1)
    </script>
</body>
</html>
